<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f2ed">
  <meta name="description" content="乐天的个人网站与项目入口。">
  <title>乐天的站点</title>
  <style>
    :root { color-scheme: light; --ink: #20231f; --muted: #73786f; --line: #d9dbd2; --paper: #f3f2ed; --accent: #3548b8; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--paper); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC", sans-serif; }
    main { width: min(760px, calc(100% - 40px)); margin: 0 auto; padding: clamp(72px, 14vh, 140px) 0 48px; }
    .eyebrow { margin: 0 0 28px; color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .16em; }
    h1 { max-width: 620px; margin: 0; font-size: clamp(42px, 8vw, 76px); line-height: 1.08; letter-spacing: -.055em; font-weight: 650; }
    .intro { max-width: 520px; margin: 24px 0 56px; color: var(--muted); font-size: 17px; line-height: 1.8; }
    h2 { margin: 0 0 14px; color: var(--muted); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
    .site-card { display: grid; grid-template-columns: 1fr auto; gap: 8px 20px; align-items: center; padding: 22px 24px; border: 1px solid var(--line); border-radius: 12px; color: inherit; text-decoration: none; transition: border-color .18s ease, transform .18s ease; }
    .site-card:hover { border-color: var(--accent); transform: translateY(-2px); }
    .site-card:focus-visible { outline: 3px solid var(--accent); outline-offset: 4px; }
    .site-type { grid-column: 1; color: var(--muted); font-size: 11px; letter-spacing: .1em; }
    .site-name { grid-column: 1; font-size: 24px; font-weight: 600; }
    .site-description { grid-column: 1; color: var(--muted); font-size: 14px; line-height: 1.6; }
    .site-arrow { grid-column: 2; grid-row: 1 / span 3; color: var(--accent); font-size: 24px; }
    footer { margin-top: 72px; padding-top: 18px; border-top: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; } }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">LETIAN · WEB</p>
    <h1>一些持续更新的地方。</h1>
    <p class="intro">个人项目与文字记录的入口。每个站点都有自己的地址，方便单独浏览和更新。</p>
    <section aria-labelledby="sites-title">
      <h2 id="sites-title">站点</h2>
      <a class="site-card" href="/blog/">
        <span class="site-type">PERSONAL BLOG</span>
        <span class="site-name">纸边集</span>
        <span class="site-description">把日常里值得记住的事，慢慢写下来。</span>
        <span class="site-arrow" aria-hidden="true">↗</span>
      </a>
    </section>
    <footer>dltsam.github.io</footer>
  </main>
</body>
</html>
